apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml7b-per-symbol
  namespace: market-data
  labels:
    app: ml7b-per-symbol
spec:
  schedule: "45 2 * * 6"   # Saturdays 02:45 PDT, 30 min after stock-screener (node-local PDT)
  timeZone: America/Los_Angeles   # explicit since 2026-11-19: without it the schedule follows the control plane's clock (UTC on the N100), which fetched Asian markets pre-open and lost a day
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 7200
  jobTemplate:
    spec:
      # 40 symbols x (one gateway call + PAUSE 7 s) does not fit in the old 600 s: the
      # kill came mid-list every week. The script stops itself at BUDGET_SECONDS (below)
      # and exits 0 with what it wrote; this deadline is only the backstop above it.
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: ml7b-per-symbol
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ml7b
              image: local/marketdata-light:v2
              imagePullPolicy: Never
              command: ["python", "/scripts/ml7b_per_symbol.py"]
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: pipeline_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: pipeline-db-rw
                - name: PGDATABASE
                  value: postgres
                - name: LLM_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      key: base-url
                      name: llm-gateway-key
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: api-key
                      name: llm-gateway-key
                - name: LLM_CAPABILITY
                  value: fast-json
                - name: MAX_SYMBOLS
                  value: "40"
                - name: BUDGET_SECONDS      # must stay below activeDeadlineSeconds
                  value: "3000"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: llm-narrative-script
