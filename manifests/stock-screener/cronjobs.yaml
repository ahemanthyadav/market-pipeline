---
# G-6 (2026-10-18): India fundamentals from NSE's own results filings -> financial_facts
# (nse_cons / nse_sa, filing-date point-in-time). Weekly incremental: filings already stored are
# skipped, so a normal run only lists ~495 symbols (~3 NSE calls each) plus any new results.
# Sun 10:00 node-local (after universe-refresh 09:00). The first full history = Job
# backfill-nse-fundamentals in backfills.yaml (~19 h, resumable).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nse-fundamentals
  namespace: market-data
spec:
  # Un-suspended 2026-11-03 after the first full backfill logged "cursor cleared" (pending-tasks G-6).
  # Both the CronJob and the backfill Job share the job_state cursor.
  suspend: false
  schedule: "0 10 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 18000
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: nse-fundamentals
              image: local/marketdata-data:v2
              imagePullPolicy: Never
              command: ["python", "nse_fundamentals.py"]
              env:
                - name: MAX_MINUTES
                  value: "270"
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: pipeline_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pipeline-db-rw
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests: {memory: 128Mi, cpu: 50m}
                limits: {memory: 512Mi, cpu: 500m}
---
# EV-1 (ADR 0025): monthly point-in-time S&P 500 membership rebuild from
# Wikipedia's constituents + changes tables into index_membership. Idempotent
# full replace of the (SP500, wikipedia) slice; validates against
# universe_constituents before writing. Monthly is plenty — index changes are
# announced in batches, and universe_membership_snapshots accrues daily anyway.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: membership-history
  namespace: market-data
spec:
  schedule: "30 11 2 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
