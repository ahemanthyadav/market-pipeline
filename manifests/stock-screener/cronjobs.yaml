# Stock-screener CronJobs (Phases B-G). All use the single toolkit image
# local/screener:v28 (imagePullPolicy: Never — import on pi1/pi2/pi3 first).
# Schedules slot into the existing UTC chain without disturbing it:
#   Sun 09:00 universe · daily 23:30 prices · Sat 06:00 fundamentals ·
#   daily 02:00 metrics → 02:15 screener → 02:30 report
# Canary each with: kubectl create job -n market-data <name>-validate --from=cronjob/<name>
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: universe-refresh
  namespace: market-data
spec:
  schedule: "0 9 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: universe
              image: local/marketdata-data:v2
              imagePullPolicy: Never
              command: ["python", "universe_refresh.py"]
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: pipeline_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pipeline-db-rw
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests: {memory: 128Mi, cpu: 100m}
                limits: {memory: 512Mi, cpu: 500m}
