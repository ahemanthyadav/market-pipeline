          automountServiceAccountToken: false
          containers:
            - name: screener
              image: local/marketdata-data:v2
              imagePullPolicy: Never
              command: ["python", "stock_screener.py"]
              env:
                # DQ-2 (2026-10-18): EDGAR financial_facts first (duration-aware, point-in-time,
