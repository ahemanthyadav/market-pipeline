# Pipeline health monitor (roadmap §3.1 heartbeat, v1). Runs 13:00 PST —
# after ALL same-day feeders (yfinance-fetcher 22:30, stock-prices 23:30
# previous night; stock-screener 02:15, nse-fetcher 11:15 same morning).
# Checks each feed's max(ts) freshness + row count and upserts one row per
# feed into pipeline_heartbeat. Grafana/alerts key off `fresh`. Image is
# node-local (Never pull) — import to pi1/pi2/pi3. Validate with:
#   kubectl create job -n market-data health-validate --from=cronjob/pipeline-health
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-health
  namespace: market-data
spec:
  schedule: "0 13 * * *"
  timeZone: America/Los_Angeles   # explicit since 2026-11-19: without it the schedule follows the control plane's clock (UTC on the N100), which fetched Asian markets pre-open and lost a day
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: health
              image: local/marketdata-light:v1
              imagePullPolicy: Never
              command: ["python", "pipeline-health.py"]
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: pipeline_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pipeline-db-rw
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 128Mi
                  cpu: 250m
