# ML-3 volatility forecasts — EWMA + GARCH(1,1) + GJR-GARCH baselines.
# Runs nightly at 03:00 UTC, after all price fetches complete.
# Writes to app.vol_forecasts table (schema 23).
# Image: marketdata-data (ml3.py + ml3_volatility.py + pgcompat.py; scipy pinned 2026-11-12 —
# before that GARCH silently fell back to EWMA) — unpinned, import to pi1/pi3. ~11 min on pi3.
# Validate with:
#   kubectl create job -n market-data ml3-volatility-validate --from=cronjob/ml3-volatility
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml3-volatility
  namespace: market-data
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: volatility
              image: local/marketdata-data:v8
              imagePullPolicy: Never
              command: ["python", "ml3.py", "run"]
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: pipeline_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pipeline-db-rw
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests: {memory: 512Mi, cpu: 250m}
                limits: {memory: 1Gi, cpu: "1"}
