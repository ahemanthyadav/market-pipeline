apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-service
  namespace: market-data
  labels:
    app: tts-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-service
  template:
    metadata:
      labels:
        app: tts-service
    spec:
      restartPolicy: Always
      nodeName: orin1
      nodeSelector:
        hardware: orin-cpu
      tolerations:
        - key: gpu
          operator: Equal
          value: orin
          effect: NoSchedule
      containers:
        - name: tts
          image: local/tts-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          env:
            # Optional shared token: once the Secret `voice-api-token` (key `token`) exists,
            # /transcribe and /speak require `Authorization: Bearer <token>`. Until then the
            # services are open to in-cluster callers (ClusterIP only). Owner-run, see
            # docs/pending-tasks.md.
            - name: VOICE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voice-api-token
                  key: token
                  optional: true
            - name: PIPER_MODEL
              value: "en_US-lessac-medium.onnx"
            - name: PIPER_VOICE_DIR
              value: "/root/.local/share/piper/voices"
          volumeMounts:
            - name: piper-voices
              mountPath: /root/.local/share/piper/voices
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: piper-voices
          hostPath:
            path: /root/.local/share/piper/voices

---
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  namespace: market-data
  labels:
    app: tts-service
spec:
  type: ClusterIP
  selector:
    app: tts-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001